<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Currency conversion</title>
  </head>
  <body>
    <script>
      let dollar = 10;
      let conversionRate = 123.59;
      let taka = dollar * conversionRate;
      document.write(dollar, " dollar is ", taka, " taka.");
    </script>
  </body>
</html>
