<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loops</title>
    <style>
      .names {
        margin: 0.5rem;
        padding: 2rem;
        border: 1px solid black;
        border-radius: 0.3rem;
      }

      body {
        display: flex;
        flex-direction: row;
      }
    </style>
  </head>
  <body>
    <script>
      let names = ["Hasan", "Mizan", "Talha", "Nayeem"];

      for (let i = 0; i < names.length; i++) {
        document.write(`<div class="names">${names[i]}</div>`);
      }
    </script>
  </body>
</html>
