    <title>HTML Class 04</title>
  </head>
  <body>
    <h1>HTML list</h1>
    <p>
      There are three types of list:<br />1. ordered list (tag: ol).<br />2.
      Unordered list (tag: ul).<br />3. Definition list (tag: dl)
    </p>
    <p>For each item of ol and ul, we use list item (li) tag.</p>

    <p>List of five fruits:</p>
    <ol>
      <li>Mango</li>
      <li>Apple</li>
      <li>Orange</li>
      <li>Grapes</li>
      <li>Watermelon</li>
    </ol>

  </body>
</html>
