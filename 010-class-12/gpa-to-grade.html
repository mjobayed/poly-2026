<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GPA to Grade</title>
  </head>
  <body>
    <label>Enter GPA:</label>
    <input type="text" id="gpa" />
    <button onclick="resultFun()">Submit</button>

    <script>
      function resultFun() {
        let gpa = Number(document.getElementById("gpa").value);
        let grade = "";

        switch (gpa) {
          case 5.0:
            grade = "A+";
            break;
          case 4.0:
            grade = "A";
            break;
          case 3.5:
            grade = "A-";
            break;
          case 3.0:
            grade = "B";
            break;
          case 2.0:
            grade = "C";
            break;
          case 1.0:
            grade = "D";
            break;
          default:
            grade = "F";
        }
        window.alert(grade);
      }
    </script>
  </body>
</html>
