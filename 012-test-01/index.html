<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <title>Student Result Management System</title>
    <link href="./style.css" rel="stylesheet" />
    <script src="./script.js" defer></script>
  </head>
  <body>
    <div class="root">
      <section class="user-input">
        <h2 class="heading">Student Result Management System</h2>
        <div class="marks-container">
          <div class="marks-row">
            <label class="input-label" for="name">Name</label>
            <div class="input-error-col">
              <input
                class="name-input"
                id="name"
                type="text"
                placeholder="Enter Student's Name"
              />
              <div class="input-error" id="name-error" style="color: red"></div>
            </div>
          </div>
          <div class="marks-row">
            <label class="input-label" for="num-bangla">Bangla</label>
            <div class="input-error-col">
              <input class="bangla-input" id="num-bangla" type="number" />
              <div
                class="input-error"
                id="bangla-error"
                style="color: red"
              ></div>
            </div>
          </div>
          <div class="marks-row">
            <label class="input-label" for="num-english">English</label>
            <div class="input-error-col">
              <input class="english-input" id="num-english" type="number" />
              <div
                class="input-error"
                id="english-error"
                style="color: red"
              ></div>
            </div>
          </div>
          <div class="marks-row">
            <label class="input-label" for="num-mathematics">Mathematics</label>
            <div class="input-error-col">
              <input
                class="mathematics-input"
                id="num-mathematics"
                type="number"
              />
              <div
                class="input-error"
                id="mathematics-error"
                style="color: red"
              ></div>
            </div>
          </div>
          <div class="marks-row">
            <label class="input-label" for="num-science">Science</label>
            <div class="input-error-col">
              <input class="science-input" id="num-science" type="number" />
              <div
                class="input-error"
                id="science-error"
                style="color: red"
              ></div>
            </div>
          </div>
          <div class="marks-row">
            <label class="input-label" for="num-ict">ICT</label>
            <div class="input-error-col">
              <input class="ict-input" id="num-ict" type="number" />
              <div class="input-error" id="ict-error" style="color: red"></div>
            </div>
          </div>
        </div>
        <button id="submit" class="submit">Calculate</button>
      </section>

      <section class="result-display" id="result-display" style="display: none">
        <h2 class="student-name"><span id="student-name"></span>'s Result</h2>
        <table class="results-table" cellspacing="0">
          <tr>
            <td>Total Marks</td>
            <td>:</td>
            <td id="total-marks"></td>
          </tr>
          <tr>
            <td>Average Marks</td>
            <td>:</td>
            <td id="avg-marks"></td>
          </tr>
          <tr>
            <td>Final Grade</td>
            <td>:</td>
            <td id="grade"></td>
          </tr>
          <tr>
            <td>Status</td>
            <td>:</td>
            <td id="status"></td>
          </tr>
        </table>
      </section>
    </div>
  </body>
</html>
